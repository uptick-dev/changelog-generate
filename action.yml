name: Generate Changelog Fragment
description: >-
  Generate a per-PR changelog fragment from commits using git-cliff, stamp it
  with the PR title, and commit it to the PR branch. Idempotent: if the fragment
  already exists it is left untouched.

inputs:
  pr-number:
    description: Pull request number; used to name the fragment file.
    required: true
  pr-title:
    description: Pull request title; injected as an HTML comment so the merge step can group by PR.
    required: false
    default: ""
  config:
    description: Path to the git-cliff config file (project-local).
    required: false
    default: cliff.toml
  fragments-dir:
    description: Directory to write the fragment into.
    required: false
    default: changelog
  git-cliff-version:
    description: Version of the prebuilt git-cliff binary to install.
    required: false
    default: "2.12.0"
  base-ref:
    description: >-
      Branch the pull request targets. The fragment covers only the commits
      between where the PR branched from it and the PR head, so commits merged
      by earlier PRs but not yet released are left out. Empty falls back to
      every commit since the last tag (git-cliff --unreleased).
    required: false
    default: ${{ github.base_ref }}
  base-repository:
    description: >-
      owner/repo that base-ref lives in. For a fork PR the checkout's origin is
      the fork, so the base branch is fetched from here instead.
    required: false
    default: ${{ github.repository }}
  record-bump:
    description: >-
      Write a "<!-- bump: patch|minor|major (computed) -->" line into the
      fragment, computed from the PR's conventional commits and title, for
      changelog-merge's semver output. Recomputed on every push; a bump line
      without "(computed)" is a manual override and is kept.
    required: false
    default: "false"
  base-sha:
    description: Commit the PR's commits are counted from when computing the bump.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  commit:
    description: Whether to commit and push the generated fragment.
    required: false
    default: "true"
  commit-message:
    description: Commit message used when committing the fragment.
    required: false
    default: Generating changelog fragment

outputs:
  fragment-path:
    description: Path to the fragment file for this PR.
    value: ${{ steps.paths.outputs.fragment-path }}
  created:
    description: "'true' if a new fragment was generated, 'false' if it already existed."
    value: ${{ steps.paths.outputs.exists == 'false' }}
  bump:
    description: The fragment's bump (patch, minor or major) when record-bump is on.
    value: ${{ steps.bump.outputs.bump }}
  pushed:
    description: >-
      'true' if this run committed and pushed to the PR branch (a new fragment
      or a changed bump line). The push starts a fresh run, so callers can skip
      the rest of this one.
    value: ${{ steps.commit.outputs.pushed == 'true' }}

runs:
  using: composite
  steps:
    - name: Resolve fragment path
      id: paths
      shell: bash
      env:
        FRAGMENTS_DIR: ${{ inputs.fragments-dir }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        mkdir -p "$FRAGMENTS_DIR"
        FRAGMENT="$FRAGMENTS_DIR/$PR_NUMBER-CHANGES.md"
        echo "fragment-path=$FRAGMENT" >> "$GITHUB_OUTPUT"
        if [ -f "$FRAGMENT" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install git-cliff
      if: steps.paths.outputs.exists == 'false'
      uses: uptick-dev/setup-git-cliff@v1
      with:
        version: ${{ inputs.git-cliff-version }}

    - name: Generate changelog fragment
      if: steps.paths.outputs.exists == 'false'
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        OUTPUT: ${{ steps.paths.outputs.fragment-path }}
        BASE_REF: ${{ inputs.base-ref }}
        BASE_REPOSITORY: ${{ inputs.base-repository }}
      run: |
        set -euo pipefail
        if [ -z "$BASE_REF" ]; then
          echo "::warning::No base-ref (not a pull_request event?); the fragment covers every commit since the last tag, which can include other unreleased PRs."
          git-cliff --config "$CONFIG" --unreleased -o "$OUTPUT"
          exit 0
        fi
        # --unreleased would also pick up commits that earlier PRs merged into
        # the base branch but that no release tag covers yet.
        # Fetch from the target repository, not origin: for a fork PR origin is
        # the fork, whose own branch of that name is not the PR's base.
        BASE_TRACKING_REF="refs/changelog-generate/base"
        if git fetch --no-tags --quiet "$GITHUB_SERVER_URL/$BASE_REPOSITORY.git" "+refs/heads/$BASE_REF:$BASE_TRACKING_REF" &&
          BASE_SHA="$(git merge-base "$BASE_TRACKING_REF" HEAD)"; then
          git-cliff --config "$CONFIG" "$BASE_SHA..HEAD" -o "$OUTPUT"
        else
          echo "::warning::Could not find where HEAD branched from $BASE_REPOSITORY@$BASE_REF (shallow checkout or no access?); the fragment covers every commit since the last tag instead."
          git-cliff --config "$CONFIG" --unreleased -o "$OUTPUT"
        fi

    - name: Add PR title to changelog fragment
      if: steps.paths.outputs.exists == 'false' && inputs.pr-title != ''
      shell: bash
      env:
        FRAGMENT: ${{ steps.paths.outputs.fragment-path }}
        PR_TITLE: ${{ inputs.pr-title }}
      run: |
        TMP_FILE="$(mktemp)"
        awk -v title="$PR_TITLE" '{print} /^## \[Unreleased\]/{print "<!-- title: " title " -->"}' "$FRAGMENT" > "$TMP_FILE" && mv "$TMP_FILE" "$FRAGMENT"

    - name: Record the semver bump in the changelog fragment
      id: bump
      if: inputs.record-bump == 'true'
      shell: bash
      env:
        FRAGMENT: ${{ steps.paths.outputs.fragment-path }}
        PR_TITLE: ${{ inputs.pr-title }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        set -euo pipefail
        BEFORE="$(grep '^<!-- bump:' "$FRAGMENT" || true)"

        # A bump line without "(computed)" was set in the PR to override the computed one, so keep it.
        if printf '%s\n' "$BEFORE" | grep -Eq '^<!-- bump: (patch|minor|major) -->$'; then
          echo "Keeping the override $BEFORE"
          echo "bump=$(printf '%s' "$BEFORE" | sed -E 's/^<!-- bump: ([a-z]+) -->$/\1/')" >> "$GITHUB_OUTPUT"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$BASE_SHA" ]; then
          echo "::error::record-bump needs base-sha (not a pull_request event?)."
          exit 1
        fi

        # Recompute on every push, so commits added after the first run still count.
        # Collect the messages in a file first, so a failed git log fails the step
        # instead of computing from the title alone.
        MESSAGES="$(mktemp)"
        git log --no-merges --format='%B%x00' "$BASE_SHA..HEAD" > "$MESSAGES"
        printf '%s\0' "$PR_TITLE" >> "$MESSAGES"
        BUMP="$(node "$GITHUB_ACTION_PATH/bump.js" < "$MESSAGES")"
        echo "Computed bump: $BUMP"
        echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        export BUMP_LINE="<!-- bump: $BUMP (computed) -->"
        TMP_FILE="$(mktemp)"

        if [ -n "$BEFORE" ]; then
          # Replace the previously computed line.
          awk '/^<!-- bump:/ {print ENVIRON["BUMP_LINE"]; next} {print}' "$FRAGMENT" > "$TMP_FILE" && mv "$TMP_FILE" "$FRAGMENT"
        else
          # Write it under the title line, or under the Unreleased heading when the fragment has no title.
          if grep -q '^<!-- title:' "$FRAGMENT"; then
            export ANCHOR='^<!-- title:'
          else
            export ANCHOR='^## \[Unreleased\]'
          fi
          awk '{print} !done && $0 ~ ENVIRON["ANCHOR"] {print ENVIRON["BUMP_LINE"]; done=1}' "$FRAGMENT" > "$TMP_FILE" && mv "$TMP_FILE" "$FRAGMENT"
        fi

        if [ "$BEFORE" = "$BUMP_LINE" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push changelog fragment
      id: commit
      if: (steps.paths.outputs.exists == 'false' || steps.bump.outputs.changed == 'true') && inputs.commit == 'true'
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
      with:
        add: ${{ steps.paths.outputs.fragment-path }}
        message: ${{ inputs.commit-message }}
